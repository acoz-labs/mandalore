name: Nominate artifact candidate

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full successful main commit SHA
        required: true
        type: string
      run_id:
        description: Successful Build retained candidate workflow run ID
        required: true
        type: string
      artifact_id:
        description: Exact retained Actions artifact ID from that run
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

jobs:
  nominate:
    name: nominate_artifact
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      vars.DELIVERY_PROFILE == 'artifact' &&
      github.repository == 'acoz-labs/mandalore'
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 15

    steps:
      - name: Checkout trusted default-branch verification tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Inspect successful candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          CANDIDATE_RUN_ID: ${{ inputs.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          bin/candidate-transport inspect --source "$SOURCE_SHA" --run-id "$CANDIDATE_RUN_ID" --artifact-id "$CANDIDATE_ARTIFACT_ID" > "$RUNNER_TEMP/mandalore-transport.json"

      - name: Download exact archive without extraction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: acoz-labs/mandalore
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/mandalore-download
          skip-decompress: true
          digest-mismatch: error

      - name: Reverify provenance and every archived payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r -d '' entry; do archives+=("$entry"); done < <(find "$RUNNER_TEMP/mandalore-download" -mindepth 1 -maxdepth 1 -print0)
          [[ "${#archives[@]}" == 1 ]]
          bin/candidate-transport verify --receipt "$RUNNER_TEMP/mandalore-transport.json" --archive "${archives[0]}" > "$RUNNER_TEMP/mandalore-verified.json"

      - name: Retain verified nomination receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mandalore-nomination-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mandalore-verified.json
          archive: true
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Verify and nominate artifact
        env:
          ACCEPTANCE_REQUIRED_CHECKS: ${{ vars.ACCEPTANCE_REQUIRED_CHECKS }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.sha }}
          STAGING_REQUIRED: "false"
        run: |
          set -euo pipefail
          RELEASE_ARTIFACT="$(jq -er '.identity' "$RUNNER_TEMP/mandalore-verified.json")"
          export RELEASE_ARTIFACT
          bin/release-gate "$RELEASE_SHA"
          bin/nominate-release-candidate \
            "$RELEASE_SHA" \
            "$RELEASE_ARTIFACT" \
            artifact \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.run_id }}" \
            application
