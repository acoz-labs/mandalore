name: Release artifact

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full accepted commit SHA
        required: true
        type: string
      artifact:
        description: Accepted immutable artifact identifier or digest
        required: true
        type: string
      run_id:
        description: Successful Build retained candidate workflow run ID
        required: true
        type: string
      artifact_id:
        description: Exact retained Actions artifact ID for the accepted candidate
        required: true
        type: string
      issues:
        description: Comma-separated issue numbers included in the release
        required: true
        type: string
      summary:
        description: Release summary
        required: true
        type: string

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: mandalore-artifact-release
  cancel-in-progress: false

jobs:
  release:
    name: release_artifact
    if: ${{ vars.SDLC_ACTIONS_ENABLED == 'true' && vars.SDLC_LEGACY_RELEASE == 'true' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.repository == 'acoz-labs/mandalore' && vars.DELIVERY_PROFILE == 'artifact') }}
    runs-on: [self-hosted, trusted-linux-x64]
    timeout-minutes: 45

    steps:
      - name: Checkout trusted release control tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned control-tool runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Verify exact accepted artifact
        env:
          ACCEPTANCE_REQUIRED_CHECKS: ${{ vars.ACCEPTANCE_REQUIRED_CHECKS }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_SHA: ${{ inputs.sha }}
          STAGING_REQUIRED: "false"
        run: bin/release-gate --require-acceptance "$RELEASE_SHA"

      - name: Inspect accepted candidate provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.sha }}
          CANDIDATE_RUN_ID: ${{ inputs.run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.artifact_id }}
        run: |
          set -euo pipefail
          bin/candidate-transport inspect --source "$SOURCE_SHA" --run-id "$CANDIDATE_RUN_ID" --artifact-id "$CANDIDATE_ARTIFACT_ID" > "$RUNNER_TEMP/mandalore-transport.json"

      - name: Download exact retained archive without extraction
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          repository: acoz-labs/mandalore
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          artifact-ids: ${{ inputs.artifact_id }}
          path: ${{ runner.temp }}/mandalore-release-download
          skip-decompress: true
          digest-mismatch: error

      - name: Verify retained bytes against accepted identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r -d '' entry; do archives+=("$entry"); done < <(find "$RUNNER_TEMP/mandalore-release-download" -mindepth 1 -maxdepth 1 -print0)
          [[ "${#archives[@]}" == 1 ]]
          bin/candidate-transport verify --receipt "$RUNNER_TEMP/mandalore-transport.json" --archive "${archives[0]}" --expected-identity "$RELEASE_ARTIFACT" > "$RUNNER_TEMP/mandalore-release-verified.json"

      - name: Recheck authority and promote the same bytes
        id: promote
        env:
          ACCEPTANCE_REQUIRED_CHECKS: ${{ vars.ACCEPTANCE_REQUIRED_CHECKS }}
          GH_TOKEN: ${{ github.token }}
          # Optional Administration:read credential, used only for the policy GET.
          # This binding does not configure a secret or enable repository policy.
          RELEASE_POLICY_READ_TOKEN: ${{ secrets.RELEASE_POLICY_READ_TOKEN }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ISSUES: ${{ inputs.issues }}
          RELEASE_SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r -d '' entry; do archives+=("$entry"); done < <(find "$RUNNER_TEMP/mandalore-release-download" -mindepth 1 -maxdepth 1 -print0)
          [[ "${#archives[@]}" == 1 ]]
          bin/promote-candidate --receipt "$RUNNER_TEMP/mandalore-transport.json" --archive "${archives[0]}" --identity "$RELEASE_ARTIFACT" --staging-parent "$RUNNER_TEMP" > "$RUNNER_TEMP/mandalore-promotion-local.json"

      - name: Verify published product and finalize artifact ledger
        id: finalize
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ISSUES: ${{ inputs.issues }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_SUMMARY: ${{ inputs.summary }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(jq -er '.manifest.manifest.version' "$RUNNER_TEMP/mandalore-release-verified.json")"
          export RELEASE_VERSION
          bin/finalize-release artifact

      - name: Prepare redacted recovery receipt
        if: always() && steps.promote.outcome != 'skipped' && steps.promote.outcome != ''
        env:
          PROMOTE_OUTCOME: ${{ steps.promote.outcome }}
          FINALIZE_OUTCOME: ${{ steps.finalize.outcome }}
        run: |
          set -euo pipefail
          if [[ -s "$RUNNER_TEMP/mandalore-promotion-local.json" ]] && \
            jq -e 'type == "object" and (.phase | type == "string")' "$RUNNER_TEMP/mandalore-promotion-local.json" >/dev/null 2>&1; then
            jq --arg promote "$PROMOTE_OUTCOME" --arg finalize "$FINALIZE_OUTCOME" \
              'del(.staging_directory) | .workflow = {promotion: $promote, finalization: $finalize} | if $finalize == "success" then .phase = "ledger-complete" else . end' \
              "$RUNNER_TEMP/mandalore-promotion-local.json" > "$RUNNER_TEMP/mandalore-promotion.json"
          else
            jq -n --arg promote "$PROMOTE_OUTCOME" --arg finalize "$FINALIZE_OUTCOME" \
              '{phase: "unconfirmed", workflow: {promotion: $promote, finalization: $finalize}, notice: "No complete process receipt; remote effects may exist. Inspect the exact candidate and release before retrying."}' \
              > "$RUNNER_TEMP/mandalore-promotion.json"
          fi

      - name: Retain candidate and publication recovery evidence
        if: always() && steps.promote.outcome != 'skipped' && steps.promote.outcome != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mandalore-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mandalore-transport.json
            ${{ runner.temp }}/mandalore-release-verified.json
            ${{ runner.temp }}/mandalore-promotion.json
          archive: true
          if-no-files-found: error
          retention-days: 90
          overwrite: false
