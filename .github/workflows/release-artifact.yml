name: Release artifact

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full accepted commit SHA
        required: true
        type: string
      artifact:
        description: Accepted immutable artifact identifier or digest
        required: true
        type: string
      version:
        description: Exact published product SemVer version (without v)
        required: true
        type: string
      issues:
        description: Comma-separated issue numbers included in the release
        required: true
        type: string
      summary:
        description: Release summary
        required: true
        type: string

permissions:
  checks: read
  contents: write
  deployments: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: mandalore-artifact-release
  cancel-in-progress: false

jobs:
  release:
    name: release_artifact
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      github.repository == 'acoz-labs/mandalore' &&
      vars.DELIVERY_PROFILE == 'artifact'
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 30

    steps:
      - name: Checkout trusted release control tooling
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned control-tool runtime
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Verify exact accepted artifact
        env:
          ACCEPTANCE_REQUIRED_CHECKS: ${{ vars.ACCEPTANCE_REQUIRED_CHECKS }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_SHA: ${{ inputs.sha }}
          STAGING_REQUIRED: "false"
        run: bin/release-gate --require-acceptance "$RELEASE_SHA"

      - name: Verify issue-specific release authority
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ISSUES: ${{ inputs.issues }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_SUMMARY: ${{ inputs.summary }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bin/finalize-release artifact --preflight

      - name: Verify published product and finalize artifact ledger
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARTIFACT: ${{ inputs.artifact }}
          RELEASE_ISSUES: ${{ inputs.issues }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_SUMMARY: ${{ inputs.summary }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bin/finalize-release artifact
