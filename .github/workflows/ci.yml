name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ${{ vars.CI_RUNNER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up pinned Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.4'
          cache: true

      - name: Validate shell scripts
        run: >-
          bash -n
          bin/ci
          bin/container
          bin/finalize-release
          bin/release-publication
          bin/promote-candidate
          bin/dependency-merge-steward
          bin/mark-staging-candidate
          bin/nominate-release-candidate
          bin/preflight-production
          bin/record-production-deployment
          bin/record-product-acceptance
          bin/release-gate

      - name: Run project checks
        run: bin/ci
