name: Dependency review

on:
  pull_request:
    paths:
      - "**/Gemfile"
      - "**/Gemfile.lock"
      - "**/package.json"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/Dockerfile"
      - "**/Dockerfile.*"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency_review:
    name: dependency_review
    runs-on: [self-hosted, trusted-linux-x64]
    if: ${{ vars.SDLC_ACTIONS_ENABLED == 'true' && (vars.ENABLE_DEPENDENCY_REVIEW == 'true') }}

    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
